#----------------------------------------------------------------
# A complete control mode is an 8 bits flag 
# (4bits control mode + 2 yaw mode bits + 2 reserved bits)
#
# ------------- mode codification (4 bits) ----------------------
#
# unset             = 0 = 0b0000
# hover             = 1 = 0b0001
# body_rates        = 2 = 0b0010
# attitude          = 3 = 0b0011
# speed             = 4 = 0b0100
# speed_in_a_plane  = 5 = 0b0101
# position          = 6 = 0b0110
# trajectory        = 7 = 0b0111
#
#-------------- yaw codification --------------------------------
# 
# angle             = 0 = 0b00
# speed             = 1 = 0b01
# 
# Bits [1:0] are reserved and ignored
# 
#-----------------------------------------------------------------

available_modes:
  - 0b00010000 # HOVER
  - 0b01000100 # SPEED with yaw SPEED in the LOCAL_FLU_FRAME
  - 0b01100000 # POSITION with yaw ANGLE in the GLOBAL_ENU_FRAME
